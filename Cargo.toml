[package]
name = "toolshed"
version = "0.1.0"
edition = "2021"
description = "Universal tool registry and executor"
license = "MIT"
repository = "https://github.com/orchestrator/toolshed"
readme = "README.md"
keywords = ["mcp", "tools", "registry"]
categories = ["command-line-utilities"]

[dependencies]
clap = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6.0"
regex = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
axum = "0.8"
async-stream = "0.3"
secrecy = { version = "0.10.3", features = ["serde"] }
tokio-util = "0.7.18"
rand = "0.10.0"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
wildcard_imports = "deny"
implicit_clone = "deny"
redundant_clone = "deny"
inefficient_to_string = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
warnings = "deny"
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
