services:
  sourcegraph:
    image: sourcegraph/server:6.10.3349-patched
    ports:
      - "7080:7080"
    environment:
      - ALLOW_SINGLE_DOCKER_CODE_INSIGHTS=true
    volumes:
      - sg-config:/etc/sourcegraph
      - sg-data:/var/opt/sourcegraph
      - ~/.sourcegraph-config/gitconfig:/etc/gitconfig:ro
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    external: true
    name: infra

volumes:
  sg-config:
    external: true
    name: sourcegraph_sg-config
  sg-data:
    external: true
    name: sourcegraph_sg-data
