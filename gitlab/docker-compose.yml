services:
  gitlab:
    image: gitlab/gitlab-ce:18.8.2-ce.0
    hostname: gitlab.local
    deploy:
      resources:
        limits:
          memory: 4G
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab'
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        registry_external_url 'http://gitlab:5050'
        gitlab_rails['registry_enabled'] = true
        registry['enable'] = true
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
    ports:
      - "80:80"
      - "443:443"
      - "2222:22"
      - "5050:5050"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./register-runner.sh:/register-runner.sh:ro
    entrypoint: ["/bin/sh", "/register-runner.sh"]
    restart: unless-stopped

networks:
  default:
    external: true
    name: infra

volumes:
  gitlab-config:
    external: true
    name: docker_gitlab-config
  gitlab-logs:
    external: true
    name: docker_gitlab-logs
  gitlab-data:
    external: true
    name: docker_gitlab-data
  gitlab-runner-config:
