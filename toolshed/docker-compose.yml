services:
  toolshed:
    build: .
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ../tools:/tools:ro
      - /tmp/orchestrator-workspaces:/workspaces:rw
    environment:
      # Vault — secrets resolved at startup by vault-env.sh
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN}
      # Non-secret config
      PORT: "8081"
      TOOLS_DIR: /tools
      UNLEASH_API_URL: http://unleash:4242/api
      HULY_URL: http://host.docker.internal:8087
      SRC_ENDPOINT: ${SRC_ENDPOINT:-http://sourcegraph:7080}
      GITLAB_URL: ${GITLAB_URL:-http://host.docker.internal:8929}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

networks:
  default:
    external: true
    name: infra
